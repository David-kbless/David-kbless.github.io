<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio de Yao David Kossi, développeur spécialisé en finance quantitative et ingénierie logicielle." />
    <meta name="theme-color" content="#dedad4" />
    <title>Yao David — Quant Dev</title>
    <base href="/" />

    <!-- Google Fonts :
         Montserrat    → titres et headings (moderne, géométrique, impactant)
         Roboto Serif  → corps de texte (lisible, élégant, technique)
         Comfortaa     → labels, navigation, badges (arrondi, propre)         -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="bg-web.jpg" as="image" fetchpriority="high">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=EB+Garamond:wght@700&family=Montserrat:wght@500;600;700;800&family=Roboto+Serif:opsz,wght@8..144,300;8..144,400;8..144,500&display=swap" rel="stylesheet">

    <!-- CSS principal de l'application -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=2" />
    <link href="Portfolio.styles.css" rel="stylesheet" />
</head>

<body>
    <!-- Point de montage de l'application Blazor WebAssembly -->
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <!-- Bandeau d'erreur Blazor (affiché uniquement en cas de crash) -->
    <div id="blazor-error-ui">
        Une erreur inattendue s'est produite.
        <a href="" class="reload">Recharger</a>
        <a class="dismiss">✕</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
